# ============================================================
#  site.creaty.fun — sitio estatico de Creaty Site
#  Servido por Apache, con /api/* reenviado al backend Node.
#  Detras de Cloudflare con SSL Full (strict).
# ============================================================

# ServerTokens y ServerSignature solo son validos en contexto global
# (fuera de <VirtualHost>). El resto va dentro del vhost de :443.
ServerTokens Prod
ServerSignature Off

# ---------- HTTP : redirigir a HTTPS ----------
# Sirve /.well-known/acme-challenge desde dist/ para que el plugin
# "apache" de certbot pueda renovar sin tocar este vhost.
<VirtualHost *:80>
    ServerName site.creaty.fun
    ServerAlias www.site.creaty.fun

    DocumentRoot /home/wilsonricardoeg/creaty-site/dist
    <Directory /home/wilsonricardoeg/creaty-site/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/site_creaty_fun_error.log
    CustomLog ${APACHE_LOG_DIR}/site_creaty_fun_access.log combined
</VirtualHost>

# ---------- HTTPS : el sitio ----------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName site.creaty.fun
    ServerAlias www.site.creaty.fun

    DocumentRoot /home/wilsonricardoeg/creaty-site/dist

    # Apache redirige /quienes-somos a /quienes-somos/ para servir el
    # index.html. Cloudflare cachea esa 301 en el edge y el navegador la
    # recibe una sola vez por URL, asi que el costo es despreciable.

    <Directory /home/wilsonricardoeg/creaty-site/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Bloqueos preventivos: ni el codigo fuente ni la API son publicos.
    <DirectoryMatch "^/home/wilsonricardoeg/creaty-site/(api|node_modules|src|\.git|deploy)">
        Require all denied
    </DirectoryMatch>

    # ---- API: reverse proxy al backend Node ----
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 30

    ProxyPass        /api http://127.0.0.1:8787/api retry=0 timeout=30
    ProxyPassReverse /api http://127.0.0.1:8787/api

    # ---- Cabeceras de seguridad ----
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always unset X-Powered-By
    Header always unset Server

    # CSP de cabecera: solo las directivas que la especificacion exige
    # entregar por HTTP (no por <meta>). El resto (script-src, style-src,
    # img-src, etc.) lo emite Astro en cada HTML con hashes SHA-256 de los
    # scripts y estilos inline del framework.
    Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" env=HTTPS

    # ---- Compresion ----
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ---- Cache: los assets con hash de Astro son inmutables ----
    <FilesMatch "\.(css|js|woff2?|png|jpg|jpeg|gif|svg|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/site_creaty_fun_error.log
    CustomLog ${APACHE_LOG_DIR}/site_creaty_fun_access.log combined

    # ---- TLS ----
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/site.creaty.fun/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/site.creaty.fun/privkey.pem
</VirtualHost>
</IfModule>